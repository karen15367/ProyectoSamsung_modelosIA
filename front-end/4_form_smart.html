<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EnergyAI — SmartLighting</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- Back nav -->
  <a class="nav-back" href="1_homepage.html"><span>←</span> Volver</a>

  <!-- Sun icon top right -->
  <div class="sun-icon">☀️</div>

  <!-- Ground -->
  <svg class="ground" viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,125 Q360,75 720,108 Q1080,138 1440,88 L1440,180 L0,180 Z" fill="#5cb85c"/>
    <path d="M0,145 Q360,118 720,136 Q1080,154 1440,126 L1440,180 L0,180 Z" fill="#4caf50"/>
    <path d="M0,159 Q400,144 800,157 Q1100,167 1440,151 L1440,180 L0,180 Z" fill="#388e3c"/>
    <!-- Turbine left -->
    <rect x="70" y="80" width="5" height="67" fill="#bbb"/>
    <g transform="translate(72,82)"><rect x="-2" y="-28" width="4" height="28" rx="2" fill="#ddd"/><rect x="-2" y="-28" width="4" height="28" rx="2" fill="#ddd" transform="rotate(120)"/><rect x="-2" y="-28" width="4" height="28" rx="2" fill="#ddd" transform="rotate(240)"/><circle cx="0" cy="0" r="3.5" fill="#aaa"/></g>
    <!-- Trees left -->
    <rect x="20"  y="110" width="9"  height="38" fill="#2d5a1b"/><ellipse cx="24"  cy="104" rx="21" ry="29" fill="#3d7a2b"/>
    <rect x="135" y="116" width="8"  height="33" fill="#2d5a1b"/><ellipse cx="139" cy="111" rx="17" ry="23" fill="#4a8c35"/>
    <!-- Eco illustration right: hand holding globe+bulb -->
    <g transform="translate(1020,18)">
      <!-- Arm/hand -->
      <ellipse cx="110" cy="148" rx="55" ry="18" fill="#f5c5a3" opacity="0.9"/>
      <!-- Globe -->
      <circle cx="110" cy="90" r="58" fill="#a8d8ea" opacity="0.7"/>
      <ellipse cx="110" cy="90" rx="58" ry="32" fill="none" stroke="#5cb85c" stroke-width="2.5" opacity="0.6"/>
      <ellipse cx="110" cy="90" rx="30" ry="58" fill="none" stroke="#5cb85c" stroke-width="1.5" opacity="0.4"/>
      <!-- Bulb on globe -->
      <ellipse cx="110" cy="68" rx="24" ry="28" fill="#ffe082" opacity="0.9"/>
      <rect x="102" y="93" width="16" height="9" rx="2" fill="#bbb"/>
      <rect x="104" y="102" width="12" height="6" rx="2" fill="#aaa"/>
      <!-- Leaf inside bulb -->
      <path d="M110,80 Q122,64 110,54 Q98,64 110,80Z" fill="#4caf50"/>
      <!-- Solar panel bottom right -->
    </g>
    <!-- Solar panels right -->
    <g transform="translate(1310,130) rotate(-8)"><rect x="0" y="0" width="50" height="30" rx="2" fill="#1565c0"/><line x1="0" y1="10" x2="50" y2="10" stroke="#90caf9" stroke-width="1"/><line x1="0" y1="20" x2="50" y2="20" stroke="#90caf9" stroke-width="1"/><line x1="16" y1="0" x2="16" y2="30" stroke="#90caf9" stroke-width="1"/><line x1="33" y1="0" x2="33" y2="30" stroke="#90caf9" stroke-width="1"/></g>
    <!-- Trees right -->
    <rect x="1380" y="108" width="9" height="40" fill="#2d5a1b"/><ellipse cx="1384" cy="102" rx="21" ry="29" fill="#3d7a2b"/>
  </svg>

  <!-- Content -->
  <div class="page" style="padding-bottom:13rem; gap:1rem;">
    <h1 class="page-title">CÁLCULO DE CONSUMO<br>SMARTLIGHTING</h1>

    <div class="field-block">
      <label class="field-label">Intensidad de iluminación ajustada</label>
      <input type="number" id="intensidad" placeholder="Ingresa el valor..." min="0" step="1"/>
      <span class="field-hint">Nivel de intensidad actual del sistema de iluminación</span>
    </div>

    <div class="field-block">
      <label class="field-label">Número de personas en la zona</label>
      <input type="number" id="personas" placeholder="Ingresa el valor..." min="0" step="1"/>
      <span class="field-hint">Cantidad de personas detectadas en la zona de medición</span>
    </div>
  </div>

  <!-- Send button bottom right -->
  <a class="btn-send" href="5_resultados_smart.html">
    <span class="btn-send-text">Enviar al<br>modelo</span>
    <span class="btn-send-arrow">➡️</span>
  </a>
</body>
</html>
